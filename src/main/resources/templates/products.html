<!DOCTYPE html>
<html xmlns="http:www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Product List</title>
</head>
<body>

<h1> Product List</h1>

  <table border="2">
     <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>price</th>
        <th>Qty</th>
     </tr>
   </thead>
   <tbody>
    <tr th:each="p : ${products}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.name}"></td>
      <td th:text="${p.price}"></td>
      <td th:text="${p.qty}"></td>      
    </tr>
   </tbody>
  </table>

</body>
</html>
