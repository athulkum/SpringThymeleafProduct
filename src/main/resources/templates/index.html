<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Form</title>
</head>
<body>
    <h1>Product Form</h1>

    <form th:action="@{/save}" th:object="${product}" method="post">
        <table>

            <!-- Name -->
            <tr>
                <td>
                   
                    Name: <input type="text" th:field="*{name}" />
                     <font color="Red">
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </font>
                </td>
            </tr>

            <!-- Price -->
            <tr>
                <td>
                    Price: <input type="text" th:field="*{price}" />
                     <font color="Red">
                        <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                    </font>
                </td>
            </tr>

            <!-- Quantity -->
            <tr>
                <td>
                    Quantity: <input type="text" th:field="*{qty}" />
                    <font color="Red">
                        <span th:if="${#fields.hasErrors('qty')}" th:errors="*{qty}"></span>
                    </font>
                </td>
            </tr>

            <!-- Submit -->
            <tr>
                <td><input type="submit" value="Submit" /></td>
            </tr>

        </table>
    </form>

    <font color="green">
        <p th:text="${msg}"></p>
    </font>

    <a th:href="@{/products}">View Product List</a>
</body>
</html>
