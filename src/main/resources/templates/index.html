<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Product Application</title>
</head>
<body>
  <h2>Product Form</h2>

  <form th:action="@{/save}" th:object="${product}" method="post">

    <table>
      <!-- Name field -->
      <tr>
        <td>Name: <input type="text" th:field="*{name}"/> </td>
      </tr>
       <!-- Price field -->
      <tr>
        <td>Price: <input type="text" th:field="*{price}"/> </td>
      </tr>
      
      <!-- Quantity field -->
      <tr>
        <td>Quantity: <input type="text" th:field="*{qty}"/> </td>
      </tr>
      
      <tr>
        <td> <input type="submit" value="submit"/> </td>
      </tr>
      
    </table>
  
  
  </form>
  <font color="green">
    <p th:text="${msg}"></p>
  </font>
</body>
</html>
